<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code</title>
<style>
:root {
  --bg: #14101c;
  --panel: #221a2e;
  --panel-2: #2c2240;
  --border: #4a3b63;
  --border-dark: #0c0911;
  --text: #efe6d2;
  --muted: #a898b8;
  --gold: #e8c547;
  --rust: #9a6440;
  --xp: #5fd35f;
  --xp-dark: #3a9a3a;
  --common: #9d9d9d;
  --uncommon: #3ccf3c;
  --rare: #3a8fe8;
  --epic: #b35cf0;
  --legendary: #ff8c1a;
  /* An explicit installed font first, so the page and its SVG screenshot render the very same glyphs. */
  --font: Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace;
  /* Insights mode: stats in cyan, real names in mint, findings in neon. */
  --ins: #7fe8ff;
  --ins-dim: #8fb4c4;
  --real: #9ef5c4;
  --neon: #ff3df0;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
  background-size: 8px 8px;
  color: var(--text);
  font: 14px/1.45 var(--font);
  padding: 24px 16px 40px;
  overflow-x: hidden;
}
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: 22px; }
.snapshot { display: grid; gap: 22px; min-width: 0; }
.panel {
  background: var(--panel);
  border: 4px solid var(--border);
  box-shadow: 0 0 0 4px var(--border-dark), 8px 8px 0 4px rgba(0,0,0,.45);
  padding: 16px 18px;
  min-width: 0;
}
h1, h2, h3 { margin: 0; font-weight: 700; }
h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
h2::before { content: '▶ '; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* Hero header */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: start; }
.avatar {
  width: 280px; height: 280px;
  border: 4px solid var(--border);
  box-shadow: 0 0 0 4px var(--border-dark);
  background: radial-gradient(circle at 50% 58%, var(--aura, #3a2f4d) 0, transparent 68%), var(--panel-2);
}
.avatar canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.hero h1 { font-size: 21px; letter-spacing: .04em; }
.class-line { font-size: 14px; margin: 4px 0 8px; }
.class-line b { color: var(--gold); }
.cls-name { position: relative; cursor: default; }
.cls-name .tip { --r: var(--gold); left: 0; transform: none; width: 300px; font-size: 12px; font-weight: 400; }
.cls-name:hover .tip { display: block; }
.lvl {
  display: inline-block; background: var(--gold); color: #1a1420; font-weight: 700;
  padding: 1px 8px; margin-right: 8px; box-shadow: 0 0 0 3px #1a1420;
}
.bar { height: 14px; background: var(--border-dark); border: 3px solid var(--border); margin: 6px 0 4px; max-width: 460px; }
.bar > i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--xp) 0 8px, var(--xp-dark) 8px 10px); }
.classes { display: grid; gap: 5px; margin-top: 12px; max-width: 560px; font-size: 12px; }
.cls { position: relative; display: grid; grid-template-columns: 10px 110px 1fr; gap: 1px 8px; align-items: center; cursor: default; }
.cls .tip { --r: var(--gold); left: 18px; transform: none; width: 360px; font-size: 12px; }
.cls:hover .tip { display: block; }
.cls > i { width: 10px; height: 10px; box-shadow: 0 0 0 2px #1a1420; }
.cls .nm { font-weight: 700; }
.cls .nm.main { color: var(--gold); }
.cls .meter { height: 6px; background: var(--border-dark); }
.cls .meter span { display: block; height: 100%; }
.cls .desc { grid-column: 2 / 4; font-size: 11px; }

/* Two independent columns: blocks stack tightly in each, so no row leaves a gap under a short block. */
.columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }
.columns.single { grid-template-columns: minmax(0, 1fr); }
.stack { display: grid; gap: 22px; align-content: start; min-width: 0; }

/* Attributes */
.radar { display: block; width: 100%; max-width: 300px; margin: 0 auto 10px; }
.radar .grid { fill: none; stroke: var(--border); stroke-width: 1; }
.radar .axis { stroke: var(--border); stroke-width: 1; }
.radar .value { fill: rgba(232,197,71,.28); stroke: var(--gold); stroke-width: 2; }
.radar .dot { fill: var(--gold); }
.radar text { fill: var(--muted); font: 12px var(--font); }
.attr { display: grid; grid-template-columns: 44px 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 0; border-top: 2px dashed #3a2f4d; }
.attr:first-of-type { border-top: 0; }
.attr .ab { color: var(--gold); font-weight: 700; }
.attr .val { font-size: 20px; font-weight: 700; text-align: right; }
.attr .meter { grid-column: 2 / 3; height: 8px; background: var(--border-dark); }
.attr .meter i { display: block; height: 100%; background: var(--gold); }
.attr .desc { grid-column: 2 / 4; }

/* Skills */
.school {
  margin-top: 22px; padding: 0 16px 8px;
  border: 3px solid var(--border); border-left: 6px solid var(--sc);
  background: rgba(0,0,0,.14); box-shadow: 0 0 0 3px var(--border-dark);
}
.school:first-of-type { margin-top: 4px; }
.school h3 {
  font-size: 19px; letter-spacing: .03em; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
  margin: 0 -16px 6px; padding: 12px 16px; background: var(--panel-2); border-bottom: 3px solid var(--sc);
}
.school h3 i { width: 22px; height: 22px; display: inline-block; background: var(--sc); box-shadow: 0 0 0 3px #1a1420; }
.school h3 .small { font-size: 12px; font-weight: 400; letter-spacing: 0; }
.list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
.skill { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-bottom: 2px dashed #3a2f4d; }
.skill .nm { overflow-wrap: anywhere; }
.skill .rk { text-align: right; color: var(--gold); white-space: nowrap; }
.skill .rk.low { color: var(--muted); }
.skill .rust { color: var(--rust); }
.skill .meta { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.pips { display: flex; gap: 3px; }
.pips span { width: 10px; height: 10px; background: var(--border-dark); box-shadow: inset 0 0 0 1px var(--border); }
.pips .on { background: var(--gold); box-shadow: none; }
.pips .rs { background: var(--rust); box-shadow: none; }

/* Inventory */
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; }
.item {
  position: relative; background: var(--panel-2); color: var(--text); font: inherit;
  border: 3px solid var(--r); box-shadow: 0 0 0 3px var(--border-dark);
  padding: 10px 4px 8px; text-align: center; cursor: default; min-width: 0;
}
.item.epic, .item.legendary { box-shadow: 0 0 0 3px var(--border-dark), 0 0 14px var(--r); }
.item canvas { width: 48px; height: 48px; image-rendering: pixelated; display: block; margin: 0 auto 6px; }
.item .nm { font-size: 12px; overflow-wrap: anywhere; display: block; }
.item .rr { font-size: 11px; color: var(--r); display: block; }
.tip {
  display: none; position: absolute; z-index: 20; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  width: 220px; max-width: 86vw; text-align: left; background: #0c0911; border: 3px solid var(--r);
  padding: 10px 12px; box-shadow: 6px 6px 0 rgba(0,0,0,.55); font-size: 12px; line-height: 1.5;
}
.item:hover .tip { display: block; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.slot {
  position: relative; background: var(--panel-2); color: var(--text); font: inherit; cursor: default; min-width: 0;
  border: 3px solid var(--r); box-shadow: 0 0 0 3px var(--border-dark); padding: 6px 4px 8px; text-align: center;
}
.slot.epic, .slot.legendary { box-shadow: 0 0 0 3px var(--border-dark), 0 0 14px var(--r); }
.slot.empty { background: rgba(0,0,0,.18); }
.slot .sl { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.slot canvas { width: 40px; height: 40px; image-rendering: pixelated; display: block; margin: 0 auto 4px; }
.slot .nm { font-size: 11px; display: block; overflow-wrap: anywhere; }
.slot.empty .nm { color: var(--muted); }
.slot .rr { font-size: 10px; color: var(--r); display: block; }
.slot:hover .tip { display: block; }
.slot:nth-child(4n + 1) .tip { left: 0; transform: none; }
.slot:nth-child(4n) .tip { left: auto; right: 0; transform: none; }
.bag-title { margin: 18px 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tip b { color: var(--r); font-size: 14px; display: block; margin-bottom: 4px; }
.tip .aff { color: #7fd0ff; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 16px; }
.legend span { font-size: 12px; color: var(--r); }
.legend span::before { content: '■ '; }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; }
.nav button {
  font: 700 18px var(--font); color: #1a1420; background: var(--gold); border: 0; width: 44px; height: 36px;
  box-shadow: 0 0 0 3px #1a1420, 4px 4px 0 3px rgba(0,0,0,.45); cursor: pointer;
}
.nav button:disabled { background: var(--border); color: var(--muted); cursor: default; }
.nav .where { text-align: center; display: grid; gap: 2px; }
.nav .where b { color: var(--gold); letter-spacing: .06em; }
.nav-side { display: flex; gap: 14px; align-items: center; }
.nav button.text-button { width: auto; padding: 0 12px; font-size: 13px; letter-spacing: .04em; }
.nav button.text-button[aria-pressed="true"] {
  background: #3de8ff; color: #06121a;
  box-shadow: 0 0 0 3px #1a1420, 0 0 14px #3de8ff, 4px 4px 0 3px rgba(0,0,0,.45);
}
@media (max-width: 640px) {
  /* Four buttons and the caption do not fit one phone row: the caption goes on top, the buttons below it. */
  .nav { flex-wrap: wrap; row-gap: 10px; }
  .nav .where { order: -1; flex-basis: 100%; }
  .nav-side { gap: 8px; }
  .nav button.text-button { padding: 0 8px; font-size: 11px; }
}
/* Title */
.title {
  position: relative; display: inline-block; margin-left: 12px; padding: 1px 10px; font: 700 13px var(--font);
  color: var(--gold); background: #1a1420; border: 2px solid var(--gold); cursor: default;
}
.title:hover .tip { display: block; }
.title .tip { --r: var(--gold); left: 0; transform: none; font-weight: 400; }
.hint { margin: 12px 0 0; }

/* Auras */
.auras { display: grid; gap: 10px; }
.aura { display: grid; grid-template-columns: 34px 1fr auto; gap: 2px 12px; align-items: center; }
.aura .orb {
  grid-row: 1 / 3; width: 26px; height: 26px; margin: 4px; background: var(--ac);
  box-shadow: 0 0 0 3px #1a1420, 0 0 var(--glow) calc(var(--glow) / 3) var(--ac);
}
.aura .nm { font-weight: 700; color: var(--ac); }
.aura .tr { text-align: right; font-size: 12px; color: var(--ac); white-space: nowrap; }
.aura .fx { grid-column: 2 / 4; }
.aura.dormant { opacity: .45; }
.aura.dormant .orb { box-shadow: 0 0 0 3px #1a1420; }

/* Alignment */
.align { display: grid; gap: 14px; justify-items: start; }
.agrid { display: grid; grid-template-columns: auto repeat(3, 60px); gap: 4px; align-items: center; }
.agrid .ax { font: 9px var(--font); letter-spacing: .02em; text-transform: uppercase; color: var(--muted); text-align: center; }
.agrid .ax.row { text-align: right; padding-right: 6px; }
.agrid .cell {
  position: relative; width: 60px; height: 60px; display: grid; place-items: center; cursor: default;
  font: 700 20px var(--font); color: #1a1420; background: var(--border-dark); box-shadow: inset 0 0 0 2px var(--border);
}
.agrid .cell.on { background: var(--gold); box-shadow: 0 0 12px var(--gold); }
.agrid .cell:hover { box-shadow: inset 0 0 0 2px var(--gold); }
.agrid .cell.on:hover { box-shadow: 0 0 12px var(--gold), inset 0 0 0 2px #1a1420; }
.agrid .cell .tip { --r: var(--gold); width: 230px; font-weight: 400; font-size: 12px; color: var(--text); }
.agrid .cell.c1 .tip { left: 0; transform: none; }
.agrid .cell.c3 .tip { left: auto; right: 0; transform: none; }
.agrid .cell:hover .tip { display: block; }
.align .an { font-size: 17px; font-weight: 700; color: var(--gold); }

/* Treasury and campfire */
.purse { position: relative; display: grid; grid-template-columns: 48px 1fr auto; gap: 2px 14px; align-items: center; padding: 8px 0; cursor: default; }
.purse .tip { --r: var(--gold); left: 62px; transform: none; width: 280px; }
.purse:hover .tip { display: block; }
.tip .here { color: var(--gold); }
.purse + .purse { border-top: 2px dashed #3a2f4d; }
.purse canvas { grid-row: 1 / 4; width: 48px; height: 48px; image-rendering: pixelated; align-self: start; }
.purse .nm { font-weight: 700; }
.purse .tr { text-align: right; color: var(--gold); white-space: nowrap; }
.purse .pips { grid-column: 2 / 4; }
.purse .fx { grid-column: 2 / 4; }
.axes { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.axes b { color: var(--text); }

/* Achievements */
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.ach {
  position: relative; background: var(--panel-2); color: var(--text); font: inherit; cursor: default; min-width: 0;
  border: 3px solid var(--r); box-shadow: 0 0 0 3px var(--border-dark); padding: 8px 4px; text-align: center;
}
.ach.earned { --r: var(--gold); box-shadow: 0 0 0 3px var(--border-dark), 0 0 10px color-mix(in srgb, var(--r) 45%, transparent); }
.ach.locked { --r: var(--border); }
.ach .md { display: block; font-size: 10px; color: var(--r); margin-top: 2px; }
.tip .got { color: var(--c); }
.medals { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: -4px 0 12px; }
.medals span { color: var(--c); }
.medals span::before { content: '● '; }
.ach.locked canvas, .ach.locked .nm { opacity: .45; }
.ach canvas { width: 40px; height: 40px; image-rendering: pixelated; display: block; margin: 0 auto 6px; }
.ach .nm { font-size: 11px; display: block; overflow-wrap: anywhere; }
.ach:hover .tip { display: block; }
.tip .st { display: block; margin-top: 4px; }

footer { text-align: center; }
.empty { text-align: center; padding: 40px 0; }

/* Insights mode: findings in neon on top, stats and real names inside every block. */
.neon {
  background: #0b0613; border-color: var(--neon);
  box-shadow: 0 0 0 4px var(--border-dark), 0 0 22px rgba(255,61,240,.45), 8px 8px 0 4px rgba(0,0,0,.45);
}
.neon h2 {
  font-size: 20px; letter-spacing: .32em; color: #ffe9fd;
  text-shadow: 0 0 2px #fff, 0 0 8px var(--neon), 0 0 18px var(--neon), 0 0 30px #b51fff;
}
.neon h2::before { content: none; }
.finding { display: grid; grid-template-columns: 24px 1fr; gap: 4px 10px; padding: 12px 0; border-top: 1px solid rgba(255,61,240,.22); }
.finding:first-of-type { border-top: 0; padding-top: 2px; }
.finding .gl { grid-row: 1 / 3; color: var(--nc); text-shadow: 0 0 6px var(--nc); font-size: 16px; line-height: 1.3; }
.finding .ft {
  font-size: 16px; font-weight: 700; color: #fff; letter-spacing: .02em;
  text-shadow: 0 0 2px #fff, 0 0 8px var(--nc), 0 0 16px var(--nc);
}
.finding .fx { font-size: 14px; color: color-mix(in srgb, var(--nc) 22%, #ffffff); text-shadow: 0 0 6px color-mix(in srgb, var(--nc) 55%, transparent); }
.neon-empty { margin: 0; color: #e9dcff; text-shadow: 0 0 6px rgba(255,61,240,.55); }
/* Progression: the archive of snapshots as section cards of small trend charts. */
.progress-panel { border-color: #2f6f82; }
.progress-panel h2 { color: var(--ins); }
/* Cards flow in columns like a masonry: no gaps under short cards. */
.pgrid { columns: 300px; column-gap: 20px; margin-top: 14px; }
.pcard {
  break-inside: avoid; display: grid; margin: 0 0 16px; padding: 10px 14px 6px;
  background: rgba(0,0,0,.18); border-left: 3px solid var(--ins);
}
.pcard h4 { margin: 0 0 4px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--real); }
.ptile { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 0 12px; align-items: center; padding: 6px 0; }
.ptile + .ptile { border-top: 1px dashed #3a2f4d; }
.ptile .pl { display: block; font-size: 11px; color: var(--ins-dim); }
.ptile .pv { font-size: 16px; font-weight: 700; color: #fff; margin-right: 8px; }
.ptile .pt { font-size: 11px; color: var(--ins); white-space: nowrap; }
.ptile .pt.good { color: #39ff88; }
.ptile .pt.bad { color: #ff4d8d; }
.ptile .pt.quiet, .pcard .quiet { color: var(--ins-dim); }
.spark { display: block; width: 96px; height: 24px; }
.spark .line { fill: none; stroke: var(--ins); stroke-width: 1.5; }
.spark .area { fill: rgba(61,232,255,.12); }
.spark .dot { fill: #fff; }
.spark .gap { stroke-dasharray: 2 3; opacity: .7; }
.spark .brk { stroke: var(--ins-dim); stroke-width: 1; stroke-dasharray: 1 2; }
.pstate { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 0 10px; padding: 3px 0; font-size: 12px; }
.pstate .k { color: var(--ins-dim); }
.pstate .v { color: var(--ins); }
.pstate .n { display: block; font-size: 11px; color: var(--ins-dim); }
.pstep { display: grid; gap: 1px; padding: 5px 0; font-size: 12px; }
.pstep + .pstep { border-top: 1px dashed #3a2f4d; }
.pstep b { color: #fff; font-size: 11px; }
.pstep span { color: var(--ins); }
.ins { font-size: 12px; line-height: 1.45; color: var(--ins); overflow-wrap: anywhere; }
.ins.dim { color: var(--ins-dim); }
.insbox {
  display: grid; gap: 2px; margin-top: 6px; padding: 6px 10px; min-width: 0; text-align: left;
  border-left: 2px solid var(--ins); background: rgba(61,232,255,.06);
}
.real { display: block; font-size: 11px; font-weight: 700; color: var(--real); overflow-wrap: anywhere; }
/* In the insights mode gear and achievements turn from grids into rows like auras: icon left, details right. */
.irows { display: grid; }
.irow { display: grid; grid-template-columns: 48px 1fr auto; gap: 2px 14px; align-items: center; padding: 10px 0; }
.irow + .irow { border-top: 2px dashed #3a2f4d; }
.irow canvas { grid-row: 1 / 4; width: 48px; height: 48px; image-rendering: pixelated; align-self: start; }
.irow .nm { font-weight: 700; color: var(--r, var(--text)); overflow-wrap: anywhere; }
.irow .tr { text-align: right; font-size: 12px; color: var(--r, var(--muted)); white-space: nowrap; }
.irow .fx, .irow .insbox { grid-column: 2 / 4; }
.irow.epic canvas, .irow.legendary canvas { filter: drop-shadow(0 0 5px var(--r)); }
.irow.empty canvas, .irow.empty .nm, .irow.locked canvas, .irow.locked .nm { opacity: .5; }
.align.wide { grid-template-columns: auto minmax(0, 1fr); column-gap: 28px; align-items: start; justify-items: stretch; }
.align.wide .axes { margin-top: 10px; }
.cls .ins { grid-column: 2 / 4; font-size: 11px; }
/* The hero's details: titled groups of label — value rows, side by side while they fit. A box narrower than
   one group (a block's details on a phone) gets a single group of its own width. */
.insgroups {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px 28px; margin-top: 14px;
  padding: 10px 12px; border-left: 2px solid var(--ins); background: rgba(61,232,255,.06);
}
.ascale { position: relative; display: flex; height: 8px; margin: 4px 0 3px; }
.ascale span { height: 100%; }
.ascale i { position: absolute; top: -4px; width: 3px; height: 16px; background: #fff; box-shadow: 0 0 6px #fff; transform: translateX(-1px); }
.ascale-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--ins-dim); margin-bottom: 8px; }
.insgroup h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--real); }
.instable { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; font-size: 12px; line-height: 1.45; }
.instable .k { color: var(--ins-dim); }
.instable .v { color: var(--ins); overflow-wrap: anywhere; white-space: pre-line; }
.instable .n { display: block; color: var(--ins-dim); font-size: 11px; }
.attr .insbox, .aura .insbox, .purse .insbox, .purse .insgroups, .attr .insgroups { grid-column: 2 / 4; }
.insgroup > .ins.dim { margin-bottom: 6px; }
.skill .insbox { grid-column: 1 / 3; margin-top: 0; }


@media (max-width: 640px) {
  .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .slot:nth-child(odd) .tip { left: 0; right: auto; transform: none; }
  .slot:nth-child(even) .tip { left: auto; right: 0; transform: none; }
  .title { margin: 6px 0 0 8px; }
  .hero { grid-template-columns: 1fr; justify-items: center; }
  .hero .info { width: 100%; }
  .hero h1, .class-line { text-align: center; }
  .bar { margin-left: auto; margin-right: auto; }
  .cls { grid-template-columns: 10px 100px 1fr; }
  .cls .tip { left: 0; }
  /* The class line is centered: its tips hang under the whole line, not from a word near its right edge. */
  .class-line { position: relative; }
  .cls-name, .title { position: static; }
  .cls-name .tip, .title .tip { left: 0; right: 0; margin: 0 auto; }
  .avatar { width: 240px; height: 240px; }
  .list { grid-template-columns: 1fr; }
  /* The alignment grid leaves no room for its details on a phone: they go under it. */
  .align.wide { grid-template-columns: minmax(0, 1fr); }
  .align.wide .agrid { justify-self: start; }
  .purse .tip { left: auto; right: 0; }
  /* A long label of a details table wraps at half the table, so its value keeps room. */
  .instable { grid-template-columns: fit-content(50%) minmax(0, 1fr); }
  .instable .k { overflow-wrap: anywhere; }
}

// The 16x16 hero sits at (2, 2) on a 20x20 portrait, leaving room for gear at the sides.
const PORTRAIT = 20;
const HERO_X = 2;
const HERO_Y = 2;
// Gear layers in portrait coordinates: r = rarity color, R = its dark shade.
const GEAR_LAYERS = {
  cloak: {
    11: '.....r........r.....', 12: '....r..........r....', 13: '....R..........R....',
    14: '....R..........R....', 15: '....RR........RR....', 16: '....R..........R....',
  },
  helmet: { 7: '.......mmmmmm.......', 8: '.......mrrrrm.......' },
  amulet: { 11: '........m..m........', 12: '.........rr.........' },
  horn: { 9: '..r.................', 10: '..rr................', 11: '...Rrm..............' },
  grimoire: { 13: '.oooo...............', 14: '.orRo...............', 15: '.oRro...............', 16: '.oooo...............' },
  boots: { 16: '......orr..rro......', 17: '......RRR..RRR......' },
  gloves: { 14: '.....R........R.....' },
  ring: { 14: '..............r.....' },
};
// Drawn after the class hat and weapon; the cloak goes first, behind everything.
const GEAR_ORDER = ['boots', 'gloves', 'ring', 'amulet', 'helmet', 'horn', 'grimoire'];

// The portrait is composed on the 20x20 layout grid, then doubled with Scale2x (smooth diagonals instead of
// blocky steps) and shaded, so the final sprite is 40x40.
const DETAIL = 2;
// Fine touches on the 40x40 grid: [x, y, new key, only over this key], so hats, visors and gear stay intact.
const FINE_DETAILS = [
  // Face: eye glints, brows, cheeks, nose shadow, mouth.
  [16, 16, 'W', 'e'], [22, 16, 'W', 'e'],
  [16, 15, 'h', 's'], [17, 15, 'h', 's'], [22, 15, 'h', 's'], [23, 15, 'h', 's'],
  [16, 18, 'c', 's'], [23, 18, 'c', 's'], [20, 18, 'S', 's'],
  [19, 19, 'z', 's'], [20, 19, 'z', 's'],
  // Neck: the doubled chin outline would read as a beard, so its middle becomes shaded skin.
  ...[20, 21].flatMap((y) => [17, 18, 19, 20, 21, 22].map((x) => [x, y, 'S', 'o'])),
  // Tunic: V-neck, clasp, belt buckle, skirt folds.
  [19, 22, 's', 'p'], [20, 22, 's', 'p'], [19, 23, 'q', 'p'], [20, 23, 'q', 'p'],
  [19, 24, 'a', 'p'], [20, 24, 'a', 'p'],
  [18, 26, 'm', 'a'], [21, 26, 'm', 'a'], [18, 27, 'm', 'a'], [21, 27, 'm', 'a'],
  [19, 26, 'g', 'a'], [20, 26, 'g', 'a'], [19, 27, 'g', 'a'], [20, 27, 'g', 'a'],
  [15, 28, 'q', 'p'], [15, 29, 'q', 'p'], [24, 28, 'q', 'p'], [24, 29, 'q', 'p'],
  // Leather boots over the dark soles.
  [13, 34, 'l', 'o'], [14, 34, 'l', 'o'], [15, 34, 'l', 'o'], [16, 34, 'l', 'o'],
  [23, 34, 'l', 'o'], [24, 34, 'l', 'o'], [25, 34, 'l', 'o'], [26, 34, 'l', 'o'],

// Keys drawn flat: outlines, eyes and small accents get no rim light or shadow.
const FLAT_KEYS = new Set(['o', 'e', 'W', 'z', 'c', 'g', 'S']);

function scale2x(grid) {
  const h = grid.length, w = grid[0].length;
  const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? null : grid[y][x]);
  const out = Array.from({ length: h * 2 }, () => Array(w * 2).fill(null));
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const P = grid[y][x], A = at(x, y - 1), B = at(x + 1, y), C = at(x - 1, y), D = at(x, y + 1);
      out[2 * y][2 * x] = C === A && C !== D && A !== B ? A : P;
      out[2 * y][2 * x + 1] = A === B && A !== C && B !== D ? B : P;
      out[2 * y + 1][2 * x] = D === C && D !== B && C !== A ? C : P;
      out[2 * y + 1][2 * x + 1] = B === D && B !== A && D !== C ? D : P;
    }
  }
  return out;
}

function drawAvatar(canvas, primary, secondary, gear) {
  const ctx = canvas.getContext('2d');
  const colors = SCHOOL_COLORS[primary] || SCHOOL_COLORS.none;
  const accent = secondary ? SCHOOL_COLORS[secondary][0] : '#e8c547';
  const palette = {
    o: '#1a1420', s: '#f1c7a1', h: '#5b3a29', e: '#1a1420', p: colors[0], q: colors[1], a: accent,
    m: '#b8c2cc', w: '#8a5a2b', g: '#fff1a8', W: '#ffffff', z: '#8a4a3a', c: '#f2a08f', S: '#d9a07e', l: '#6b4630',
  };
  const worn = {};
  for (const item of gear || []) if (item.equipped && item.slot) worn[item.slot] = item;
  // Cells hold keys, not colors: gear pixels are 'r:<slot>' / 'R:<slot>' so each keeps its rarity color.
  const grid = Array.from({ length: PORTRAIT }, () => Array(PORTRAIT).fill(null));
  const paint = (layer, dx, dy, slot) => {
    for (const [row, line] of Object.entries(layer || {})) {
      [...line].forEach((cell, x) => {
        const gx = x + dx, gy = Number(row) + dy;
        if (cell === '.' || gx >= PORTRAIT || gy >= PORTRAIT) return;
        const key = slot && (cell === 'r' || cell === 'R') ? `${cell}:${slot}` : cell;
        if (key.includes(':') || palette[key]) grid[gy][gx] = key;
      });
    }
  };
  const wear = (slot) => { if (worn[slot]) paint(GEAR_LAYERS[slot], 0, 0, slot); };
  paint(Object.fromEntries(BASE.map((line, y) => [y, line])), HERO_X, HERO_Y);
  wear('cloak');
  paint(HATS[primary], HERO_X, HERO_Y);
  paint(ITEMS[secondary || primary], HERO_X, HERO_Y);
  GEAR_ORDER.forEach(wear);

  const fine = scale2x(grid);
  for (const [x, y, key, over] of FINE_DETAILS) if (fine[y][x] === over) fine[y][x] = key;

  const colorOf = (key) => {
    if (!key.includes(':')) return palette[key];
    const [kind, slot] = key.split(':');
    const color = RARITY_HEX[worn[slot].rarity];
    return kind === 'R' ? shade(color, 0.6) : color;
  };
  const edge = (x, y) => y < 0 || y >= fine.length || x >= fine.length || !fine[y][x] || fine[y][x] === 'o';
  const glowing = [];
  const pixels = [];
  fine.forEach((line, y) => line.forEach((key, x) => {
    if (!key) return;
    let color = colorOf(key);
    // Light from the top-left: a lit rim under outlines above, a shadow along outlines below and right.
    if (!FLAT_KEYS.has(key)) {
      if (edge(x, y - 1)) color = lighten(color, 0.25);
      else if (edge(x, y + 1) || edge(x + 1, y)) color = shade(color, 0.78);
    }
    pixels.push([x, y, color]);
    const slot = key.includes(':') && key.split(':')[1];
    if (slot && ['epic', 'legendary'].includes(worn[slot].rarity)) glowing.push([x, y, colorOf(key)]);
  }));
  // Epic and legendary gear glows: a blurred pass first, then crisp pixels on top.
  for (const [x, y, color] of glowing) {
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 3;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, 1, 1);
    ctx.restore();
  }
  for (const [x, y, color] of pixels) { ctx.fillStyle = color; ctx.fillRect(x, y, 1, 1); }
}

function lighten(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const ch = (v) => Math.round(v + (255 - v) * amount).toString(16).padStart(2, '0');
  return `#${ch(n >> 16)}${ch((n >> 8) & 255)}${ch(n & 255)}`;
}

function shade(hex, factor) {
  const n = parseInt(hex.slice(1), 16);
  const ch = (v) => Math.round(v * factor).toString(16).padStart(2, '0');
  return `#${ch(n >> 16)}${ch((n >> 8) & 255)}${ch(n & 255)}`;
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

// Appends a node when there is one: insights helpers return null for items they know nothing about.
function put(parent, node) {
  if (node) parent.appendChild(node);
}

// Noun form for a count: three Russian forms (1 день, 2 дня, 5 дней) or two English ones (1 day, 2 days).
function plural(n, forms) {
  if (forms.length < 3) return n === 1 ? forms[0] : forms[1];
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return forms[0];
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return forms[1];
  return forms[2];
}

// A day from its ISO string, never through Date: a date parsed as UTC shows the day before in western timezones.
function fmtDay(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.slice(0, 10).split('-');
  return T.date(d, m, y);
}

// A day without its year, for the charts and lists of the insights mode.
function fmtShortDay(iso) {
  if (!iso) return '—';
  const [, m, d] = iso.slice(0, 10).split('-');
  return T.shortDate(d, m);
}

function hash(text) {
  let h = 2166136261;
  for (const ch of text) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Mirrored 6x6 glyph inside an 8x8 frame, seeded by the item alias.
function drawIcon(canvas, name, color) {
  const ctx = canvas.getContext('2d');
  const random = rng(hash(name));
  const dark = shade(color, 0.55);
  let filled = 0;
  for (let y = 1; y < 7; y++) {
    for (let x = 1; x < 4; x++) {
      const r = random();
      const fill = r < 0.5 ? color : r < 0.68 ? dark : null;
      if (!fill) continue;
      filled++;
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, 1, 1);
      ctx.fillRect(7 - x, y, 1, 1);
    }
  }
  if (filled < 4) { ctx.fillStyle = color; ctx.fillRect(3, 2, 2, 4); }
}

function svg(tag, attrs) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
}

function radar(attrs) {
  const n = attrs.length, cx = 150, cy = 132, radius = 96;
  const point = (i, r) => {
    const angle = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  };
  const root = svg('svg', { viewBox: '0 0 300 270', class: 'radar', role: 'img', 'aria-label': T.radar });
  for (const level of [5, 10, 15, 20]) {
    const pts = attrs.map((_, i) => point(i, (radius * level) / 20).join(',')).join(' ');
    root.appendChild(svg('polygon', { points: pts, class: 'grid' }));
  }
  attrs.forEach((a, i) => {
    const [x, y] = point(i, radius);
    root.appendChild(svg('line', { x1: cx, y1: cy, x2: x, y2: y, class: 'axis' }));
    const [lx, ly] = point(i, radius + 20);
    const label = svg('text', { x: lx, y: ly + 4, 'text-anchor': 'middle' });
    label.textContent = `${a.abbr} ${a.value}`;
    root.appendChild(label);
  });
  const pts = attrs.map((a, i) => point(i, (radius * a.value) / 20));
  root.appendChild(svg('polygon', { points: pts.map((p) => p.join(',')).join(' '), class: 'value' }));
  pts.forEach(([x, y]) => root.appendChild(svg('rect', { x: x - 3, y: y - 3, width: 6, height: 6, class: 'dot' })));
  return root;
}

function auraFor(level) {
  if (level >= 50) return '#ff8c1a';
  if (level >= 35) return '#e8c547';
  if (level >= 20) return '#c9d1d9';
  if (level >= 10) return '#cd7f32';
  return '#3a2f4d';
}

// Class name with a hover tooltip: what a hybrid is mixed from and what it became, or the epithet of a pure
// class. Snapshots before schema 8 carry no lore and show the bare name.
function schoolName(key) {
  return (C.schools || []).find((school) => school.key === key)?.name || key;

function className() {
  const name = el('b', 'cls-name', C.class.name);

    tip.appendChild(el('b', null, T.hybridTitle(C.class.name)));
    tip.appendChild(el('span', null, T.hybridMix(schoolName(C.class.primary), schoolName(C.class.secondary))));
    tip.appendChild(el('span', 'st here', T.hybridLore(C.class.lore)));
  } else if (C.class.epithet) {
    tip.appendChild(el('b', null, C.class.epithet));
    tip.appendChild(el('span', null, T.pureClass));
    tip.appendChild(el('span', 'st here', T.pureLore(C.class.name, C.class.lore)));
  } else {
    tip.appendChild(el('b', null, C.class.name));
    tip.appendChild(el('span', null, `${C.class.lore[0].toUpperCase()}${C.class.lore.slice(1)}.`));
  }
  if (C.class.basis === 'peak') tip.appendChild(el('span', 'st muted', T.peakClass));
  name.appendChild(tip);
  return name;

// Attributes from the strongest down; a stable sort keeps the usual order among equals.
function byValue(attributes) {
  return [...attributes].sort((a, b) => b.value - a.value);

function itemTip(item, slot) {
  const tip = el('span', 'tip');
  tip.appendChild(el('b', null, item.alias));
  if (slot) tip.appendChild(el('span', 'st muted', T.worn(slot.name)));
  tip.appendChild(el('span', 'st', T.rarity(item.rarity_name)));
  if (item.peak_rarity !== item.rarity) tip.appendChild(el('span', 'st muted', T.peak(item.peak_rarity_name)));
  tip.appendChild(el('span', 'st aff', `+${item.affixes} ${plural(item.affixes, T.affixes)}`));
  tip.appendChild(el('span', 'st muted', T.affixHint));
  return tip;
}

const RARITY_ORDER = ['common', 'uncommon', 'rare', 'epic', 'legendary'];

// Rarest first; items of one rarity keep the page order, which is by how much they are used.
function byRarity(items) {
  return [...items].sort((a, b) => RARITY_ORDER.indexOf(b.rarity) - RARITY_ORDER.indexOf(a.rarity));
}

// Slots by the rarity of what is worn in them; empty slots close the list in their usual order.
function slotsByRarity(worn) {
  const rank = (slot) => (worn[slot.key] ? RARITY_ORDER.indexOf(worn[slot.key].rarity) : -1);
  const place = (slot) => (worn[slot.key] ? C.gear.indexOf(worn[slot.key]) : C.slots.indexOf(slot));
  return [...C.slots].sort((a, b) => rank(b) - rank(a) || place(a) - place(b));
}

// A slot's glyph in the worn item's rarity color, dim when the slot is empty.
function drawSlotIcon(canvas, slotKey, item) {
  const color = item ? RARITY_HEX[item.rarity] : '#4a3b63';
  drawGlyph(canvas, SLOT_ICONS[slotKey], color, item ? lighten(color, 0.45) : '#3a2f4d');
}

// An achievement's glyph in its medal color, muted while not earned.
function drawAchievementIcon(canvas, item) {
  const medal = MEDALS[medalOf(item)];
  drawGlyph(canvas, ACH_ICONS[item.key] || ACH_ICONS.flawless, medal ? medal.main : '#6b5d80', medal ? medal.light : '#8a7ca0');
}

function itemCell(item) {
  // Plain blocks, not buttons: every tooltip on the page opens on hover only, a click does nothing.
  const cell = el('div', `item ${item.rarity}`);
  cell.style.setProperty('--r', `var(--${item.rarity})`);
  const icon = el('canvas');
  icon.width = 8; icon.height = 8;
  drawIcon(icon, item.alias, RARITY_HEX[item.rarity]);
  cell.appendChild(icon);
  cell.appendChild(el('span', 'nm', item.alias));
  cell.appendChild(el('span', 'rr', item.rarity_name));
  cell.appendChild(itemTip(item, null));
  return cell;
}

function slotCell(slot, item) {
  const cell = el('div', item ? `slot ${item.rarity}` : 'slot empty');
  cell.style.setProperty('--r', item ? `var(--${item.rarity})` : 'var(--border)');
  cell.appendChild(el('span', 'sl', slot.name));
  const icon = el('canvas');
  icon.width = 8; icon.height = 8;
  drawSlotIcon(icon, slot.key, item);
  cell.appendChild(icon);
  cell.appendChild(el('span', 'nm', item ? item.alias : T.empty));
  if (item) cell.appendChild(el('span', 'rr', item.rarity_name));
  if (item) {
    cell.appendChild(itemTip(item, slot));
  } else {
    const tip = el('span', 'tip');
    tip.appendChild(el('b', null, slot.name));
    tip.appendChild(el('span', null, T.emptySlot(slot.desc)));
    cell.appendChild(tip);
  }
  return cell;
}

function renderGear(parent) {
  const panel = el('section', 'panel');
  // Snapshots before schema 3 have no slots: they keep the plain inventory grid.
  const slotted = Array.isArray(C.slots);
  panel.appendChild(el('h2', null, slotted ? T.gear : T.bag));
  if (!C.gear.length) panel.appendChild(el('p', 'muted', T.noGear));
  if (slotted && I) {
    insGearRows(panel);
  } else if (slotted) {
    const worn = {};
    for (const item of C.gear) if (item.equipped && item.slot) worn[item.slot] = item;
    const doll = el('div', 'slots');
    for (const slot of slotsByRarity(worn)) doll.appendChild(slotCell(slot, worn[slot.key]));
    panel.appendChild(doll);
    const bag = byRarity(C.gear.filter((item) => !item.equipped));
    panel.appendChild(el('h3', 'bag-title', T.bag));
    if (!bag.length) panel.appendChild(el('p', 'small muted', T.bagEmpty));
    const grid = el('div', 'inv');
    bag.forEach((item) => grid.appendChild(itemCell(item)));
    panel.appendChild(grid);
  } else {
    const grid = el('div', 'inv');
    byRarity(C.gear).forEach((item) => grid.appendChild(itemCell(item)));
    panel.appendChild(grid);
  }
  const legend = el('div', 'legend');
  for (const r of C.rarities) {
    const tag = el('span', null, r.name);
    tag.style.setProperty('--r', `var(--${r.key})`);
    legend.appendChild(tag);
  }

function renderAlignment(parent) {
  const a = C.alignment;
  const panel = el('section', 'panel');
  panel.appendChild(el('h2', null, T.alignment));
  const box = el('div', 'align');
  // Columns are order ↔ chaos, rows are good ↔ evil; the hero's cell carries a star.
  const grid = el('div', 'agrid');
  const names = {};
  for (const cell of C.alignment_grid || []) names[`${cell.law}/${cell.moral}`] = cell;
  grid.appendChild(el('span'));
  for (const [, label] of ALIGN_LAWS) grid.appendChild(el('span', 'ax', label));
  for (const [moral, rowLabel] of ALIGN_MORALS) {
    grid.appendChild(el('span', 'ax row', rowLabel));
    ALIGN_LAWS.forEach(([law], column) => {
      const here = law === a.law && moral === a.moral;
      // A plain span, not a button: the explanation shows on hover only, a click does nothing.
      const cell = el('span', `cell c${column + 1}${here ? ' on' : ''}`, here ? '★' : '');
      const info = names[`${law}/${moral}`];
      cell.setAttribute('aria-label', info ? info.name : `${ALIGN_LAWS[column][1]}, ${rowLabel}`);
      if (info) {
        const tip = el('span', 'tip');
        tip.appendChild(el('b', null, info.name));
        tip.appendChild(el('span', null, info.desc));
        if (here) tip.appendChild(el('span', 'st muted', T.heroHere));

      }
      grid.appendChild(cell);
    });

  box.appendChild(grid);
  const text = el('div');
  text.appendChild(el('div', 'an', a.name));
  text.appendChild(el('div', 'small muted', a.desc));
  box.appendChild(text);

  const law = el('li');
  law.appendChild(el('b', null, T.lawAxis));
  law.appendChild(document.createTextNode(T.lawAxisText));
  const moral = el('li');
  moral.appendChild(el('b', null, T.moralAxis));
  moral.appendChild(document.createTextNode(T.moralAxisText));
  axes.appendChild(law);
  axes.appendChild(moral);

function drawGlyph(canvas, rows, main, accent, third) {
  const ctx = canvas.getContext('2d');
  rows.forEach((line, y) => [...line].forEach((cell, x) => {
    const color = cell === 'x' ? main : cell === 'y' ? accent : cell === 'z' ? third : null;
    if (color) { ctx.fillStyle = color; ctx.fillRect(x, y, 1, 1); }
  }));
}

function treasuryRow(icon, colors, title, tier, tiers, text, steps, open) {
  const row = el('div', 'purse');
  // Hover shows every step with its threshold; snapshots before schema 7 have no steps.
  if (steps) {
    const tip = el('span', 'tip');
    tip.appendChild(el('b', null, T.tierSteps(title)));
    steps.forEach((step, i) => {
      const here = i === tier.tier;
      tip.appendChild(el('span', here ? 'st here' : 'st muted', `${here ? '✓' : '·'} ${step.name} — ${step.from}`));
    });
    tip.appendChild(el('span', 'st muted', open));
    tip.appendChild(el('span', 'st', T.tierNow(tier.name)));
    row.appendChild(tip);
  }
  const canvas = el('canvas');
  canvas.width = 8; canvas.height = 8;
  drawGlyph(canvas, icon, ...colors);
  row.appendChild(canvas);
  row.appendChild(el('span', 'nm', title));
  row.appendChild(el('span', 'tr', tier.name));
  const pips = el('span', 'pips');
  pips.setAttribute('aria-label', T.tierPips(tier.tier + 1, tiers.length));
  tiers.forEach((_, i) => pips.appendChild(el('span', i <= tier.tier ? 'on' : '')));
  row.appendChild(pips);
  row.appendChild(el('span', 'fx small muted', text));
  return row;
}

// The achievement behind the title: by its key, or by its name in snapshots before schema 13.
function titleSource() {
  const items = C.achievements || [];
  return C.title_key ? items.find((item) => item.key === C.title_key) : items.find((item) => item.name === C.title);
}

// Medal of an achievement; snapshots before medals (schema < 6) had one threshold, shown as gold.
function medalOf(item) {
  if ('tier' in item) return item.tier;
  return item.earned ? 2 : -1;
}

function renderAchievements(parent) {
  const panel = el('section', 'panel');
  panel.appendChild(el('h2', null, T.achievements));
  const counts = [0, 0, 0];
  C.achievements.forEach((item) => { if (medalOf(item) >= 0) counts[medalOf(item)] += 1; });
  const summary = el('div', 'medals small');
  [2, 1, 0].forEach((tier) => {
    const tag = el('span', null, `${MEDALS[tier].name} ${counts[tier]}`);
    tag.style.setProperty('--c', MEDALS[tier].main);
    summary.appendChild(tag);
  });
  panel.appendChild(summary);
  const grid = el('div', 'achs');
  // Gold first, then silver, bronze and not yet earned; a stable sort keeps prestige order within a medal.
  const byMedal = [...C.achievements].sort((a, b) => medalOf(b) - medalOf(a));
  for (const item of I ? [] : byMedal) {
    const tier = medalOf(item);
    const medal = MEDALS[tier];
    // A plain block, not a button: the conditions show on hover only, a click does nothing.
    const cell = el('div', tier >= 0 ? 'ach earned' : 'ach locked');
    if (medal) cell.style.setProperty('--r', medal.main);
    const icon = el('canvas');
    icon.width = 8; icon.height = 8;
    drawAchievementIcon(icon, item);
    cell.appendChild(icon);
    cell.appendChild(el('span', 'nm', item.name));
    if (medal) cell.appendChild(el('span', 'md', medal.name));
    const tip = el('span', 'tip');
    tip.appendChild(el('b', null, item.name));
    if (Array.isArray(item.criteria)) {
      item.criteria.forEach((text, i) => {
        const line = el('span', i <= tier ? 'st got' : 'st muted', `${i <= tier ? '✓' : '·'} ${MEDALS[i].name}: ${text}`);
        if (i <= tier) line.style.setProperty('--c', MEDALS[i].main);
        tip.appendChild(line);
      });
    } else {
      tip.appendChild(el('span', null, T.condition(item.criteria)));
    }
    tip.appendChild(el('span', 'st muted', tier >= 0 ? T.medalNow(MEDALS[tier].name) : T.notEarned));
    cell.appendChild(tip);
    grid.appendChild(cell);
  }
  panel.appendChild(I ? insAchievementRows(byMedal) : grid);
  panel.appendChild(el('p', 'hint small muted', T.medalHint(Boolean(I))));
  parent.appendChild(panel);
}

const TWO_COLUMNS = window.matchMedia('(min-width: 800px)');

function renderSnapshot(app) {
  app.replaceChildren();
  I = INSIGHTS ? C.insights || null : null;
  if (INSIGHTS) {
    renderFindings(app);
    renderProgression(app);
  }
  renderHero(app);
  // Half-width blocks in page order; a group stays together in one column (the treasury sits under the
  // alignment). Older snapshots miss some blocks: schema 1 has no auras, alignment or achievements.
  const blocks = [
    [renderAttributes],
    [renderGear],
    [C.auras && renderAuras],
    [C.alignment && renderAlignment, C.treasury && renderTreasury],
    [C.achievements && renderAchievements],
  ].map((group) => group.filter(Boolean)).filter((group) => group.length);
  // The insights mode puts every block on the full width: the details need the room.
  const wide = TWO_COLUMNS.matches && !INSIGHTS;
  const columns = el('div', wide ? 'columns' : 'columns single');
  const left = el('div', 'stack');
  const right = el('div', 'stack');
  columns.appendChild(left);
  if (wide) columns.appendChild(right);
  app.appendChild(columns);
  // Each group goes to the column that is shorter right now, so both columns grow evenly.
  for (const group of blocks) {
    const target = !wide || left.offsetHeight <= right.offsetHeight ? left : right;
    group.forEach((block) => block(target));
  }
  renderSkills(app);
  app.appendChild(el('footer', 'small muted', T.path(fmtDay(C.period.from), fmtDay(C.period.to))));
}

// Screenshot of the sheet without the archive bar and the dates line: the page is cloned, pixel canvases are
// swapped for their images (canvases do not survive serialization), the clone is drawn as an SVG
// foreignObject onto a canvas at 2x and saved as PNG. No libraries and no network.
async function renderShot() {
  const app = document.getElementById('app');
  const pad = 24;
  const blocks = [...app.children].filter((node) => node.tagName !== 'FOOTER');
  const top = blocks[0].getBoundingClientRect().top;
  const bottom = Math.max(...blocks.map((node) => node.getBoundingClientRect().bottom));
  const width = Math.ceil(app.getBoundingClientRect().width + pad * 2);
  const height = Math.ceil(bottom - top + pad * 2);

  const clone = app.cloneNode(true);
  clone.querySelectorAll('footer').forEach((node) => node.remove());
  const sources = app.querySelectorAll('canvas');
  clone.querySelectorAll('canvas').forEach((copy, i) => {
    const source = sources[i];
    const computed = getComputedStyle(source);
    const img = document.createElement('img');
    img.src = source.toDataURL();
    img.className = source.className;
    for (const prop of ['width', 'height', 'display', 'margin', 'image-rendering', 'grid-row', 'align-self', 'opacity', 'filter']) {
      img.style.setProperty(prop, computed.getPropertyValue(prop));
    }
    copy.replaceWith(img);
  });

  // The clone may lay out a little taller inside the SVG than on the page, so it is drawn with room to spare
  // and a magenta marker right after it tells where the content really ends.
  const room = height + Math.max(600, Math.round(height * 0.2));
  const wrapper = document.createElement('div');
  wrapper.className = 'shot';
  // Font, colors and background come from the page's own body rule (see the CSS below), so the line
  // height stays a ratio: a computed pixel value would stretch every smaller text.
  Object.assign(wrapper.style, {
    width: `${width}px`, minHeight: `${room}px`, padding: `${pad}px ${pad}px 0`, boxSizing: 'border-box',
    overflow: 'visible',
  });
  // The marker is thick (a thin line can vanish when a tall SVG is rasterized) and sits below the drop
  // shadow of the last panel, so cropping at its top keeps the shadow.
  const markerSize = 40;
  const shadowRoom = 16;
  const marker = document.createElement('div');
  marker.style.cssText = `margin-top:${shadowRoom}px;height:${markerSize}px;background:#ff00ff`;
  const css = document.createElement('style');
  // Variables live on :root and the base look on body; inside the SVG the wrapper plays both roles.
  css.textContent = [...document.querySelectorAll('style')].map((node) => node.textContent).join('\n')
    .replace(/:root\b/g, ':root, .shot')
    .replace(/\bbody\s*\{/g, 'body, .shot {');
  wrapper.appendChild(css);
  wrapper.appendChild(clone);
  wrapper.appendChild(marker);

  const markup = new XMLSerializer().serializeToString(wrapper);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${room}">`
    + `<foreignObject x="0" y="0" width="100%" height="100%">${markup}</foreignObject></svg>`;
  const image = new Image();
  image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
  await image.decode();
  // 2x for crisp pixels, less for a very tall page (the insights mode): browsers refuse canvases taller than
  // about 32 thousand pixels or larger than about 250 megapixels.
  const scale = Math.min(2, 32000 / room, Math.sqrt(250e6 / (width * room)));
  const full = document.createElement('canvas');
  full.width = Math.round(width * scale);
  full.height = Math.round(room * scale);
  const ctx = full.getContext('2d');
  ctx.scale(scale, scale);
  ctx.drawImage(image, 0, 0);
  // WebKit may paint images embedded in the SVG a tick late: draw once more.
  await new Promise((resolve) => setTimeout(resolve, 150));
  ctx.drawImage(image, 0, 0);

  // One pixel column is enough to find the marker; then crop just after the content, keeping the bottom padding.
  const column = ctx.getImageData(Math.floor(full.width / 2), 0, 1, full.height).data;
  let end = -1;
  for (let y = 0; y < full.height; y++) {
    const i = y * 4;
    if (column[i] > 240 && column[i + 1] < 16 && column[i + 2] > 240) { end = y; break; }
  }
  if (end < 0) end = Math.round((height + shadowRoom) * scale);
  const markerHeight = Math.round(markerSize * scale);
  const tail = Math.round((pad - shadowRoom) * scale);
  const canvas = document.createElement('canvas');
  canvas.width = full.width;
  canvas.height = end + tail;
  const out = canvas.getContext('2d');
  out.drawImage(full, 0, 0, full.width, end, 0, 0, full.width, end);
  out.drawImage(full, 0, end + markerHeight, full.width, tail, 0, end, full.width, tail);
  return canvas;
}

async function saveShot(button) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = T.shooting;
  try {
    const canvas = await renderShot();
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `harness-rpg-${C.generated_at.slice(0, 10)}${INSIGHTS ? '-insights' : ''}.png`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 5000);
  } catch (error) {
    console.error(error);
    alert(T.shotFailed);
  } finally {
    button.disabled = false;
    button.textContent = label;
  }
}
