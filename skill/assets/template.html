const TONES = {
  rise: { glyph: '▲', color: '#39ff88' },
  fall: { glyph: '▼', color: '#ff4d8d' },
  note: { glyph: '◆', color: '#3de8ff' },
};
const TOOLS_LISTED = 10;
const TOKEN_LABELS = IT.tokenLabels;

// Numbers in the page language: 12 345 and 3,5 with a no-break space in Russian, 12,345 and 3.5 in English.
function num(value, digits = 0) {
  const rounded = Number(Number(value || 0).toFixed(digits));
  const [whole, part] = String(Math.abs(rounded)).split('.');
  return (rounded < 0 ? '-' : '') + whole.replace(/\B(?=(\d{3})+(?!\d))/g, T.thousands) + (part ? `${T.decimal}${part}` : '');
}

// A count with its noun: 1 сессия, 3 сессии, 5 сессий or 1 session, 5 sessions.
function count(n, forms) {
  return `${num(n)} ${plural(Math.round(n), forms)}`;
}

function pct(share) {
  return `${Math.round(100 * (share || 0))}%`;
}

function millions(value) {
  return IT.millions(value);
}

// A day with how long ago it was, counted from the snapshot, not from today: archived heroes stay truthful.
function ago(iso) {
  if (!iso) return '—';
  const days = Math.round((new Date(C.generated_at.slice(0, 10)) - new Date(iso.slice(0, 10))) / 864e5);
  return `${fmtDay(iso)}, ${IT.ago(days)}`;
}

function insLine(text, cls) {
  return el('div', cls ? `ins ${cls}` : 'ins', text);
}

function insBox(lines) {
  const box = el('div', 'insbox');
  for (const line of lines) if (line) box.appendChild(typeof line === 'string' ? insLine(line) : line);
  return box;
}

function realName(text) {
  return el('span', 'real', text);
}

function renderFindings(app) {
  const panel = el('section', 'panel neon');
  panel.appendChild(el('h2', null, IT.findings));
  const findings = (C.insights && C.insights.findings) || [];
  if (!C.insights) {
    panel.appendChild(el('p', 'neon-empty', IT.noInsights));
  } else if (!findings.length) {
    panel.appendChild(el('p', 'neon-empty', IT.noFindings));
  }
  for (const finding of findings) {
    const tone = TONES[finding.tone] || TONES.note;
    const row = el('div', 'finding');
    row.style.setProperty('--nc', tone.color);
    row.appendChild(el('span', 'gl', tone.glyph));
    row.appendChild(el('span', 'ft', finding.title));
    row.appendChild(el('span', 'fx', finding.text));
    panel.appendChild(row);
  }
  app.appendChild(panel);
}

// A titled group of "label — value" rows; a row may carry a short note under its value.
function insGroup(title, rows) {
  const group = el('div', 'insgroup');
  group.appendChild(el('h4', null, title));
  const table = el('div', 'instable');
  for (const [label, value, note] of rows.filter(Boolean)) {
    table.appendChild(el('span', 'k', label));
    const cell = el('span', 'v', value);
    if (note) cell.appendChild(el('span', 'n', note));
    table.appendChild(cell);
  }
  group.appendChild(table);
  return group;
}

// Progression is read straight from the archive of snapshots embedded in the page: nothing new is stored.
// Snapshots come whenever the hero is run — daily, weekly or with long breaks. One point per day with a run (the
// day's last snapshot, so a busy day does not crowd the charts), up to the snapshot on screen: browsing the archive
// back shows the history as it was then.
// The last ten snapshots are enough to see a trend and keep the charts small.
const PROGRESS_POINTS = 10;
// On the charts the distance between points is the time between them; a break longer than this is squeezed to it
// and drawn dashed, so one long pause does not flatten everything else.
const GAP_CAP_DAYS = 7;
// Skill rank index of Умелец (Adept) in SKILL_RANKS.
const SKILLED_RANK = 3;

function historyPoints() {
  const byDay = new Map();
  for (const snapshot of H.slice(0, H.indexOf(C) + 1)) byDay.set(snapshot.generated_at.slice(0, 10), snapshot);
  return [...byDay.values()].slice(-PROGRESS_POINTS);
}

function dayNumber(iso) {
  const [y, m, d] = iso.slice(0, 10).split('-').map(Number);
  return Date.UTC(y, m - 1, d) / 864e5;
}

// Horizontal positions of the points in days, with long breaks squeezed to GAP_CAP_DAYS and remembered.
function timeline(points) {
  const days = points.map((point) => dayNumber(point.generated_at));
  const xs = [0];
  const breaks = [];
  for (let i = 1; i < days.length; i++) {
    const gap = days[i] - days[i - 1];
    xs.push(xs[i - 1] + Math.min(gap, GAP_CAP_DAYS));
    if (gap > GAP_CAP_DAYS) breaks.push({ index: i, days: gap, from: points[i - 1], to: points[i] });
  }
  return { xs, total: xs[xs.length - 1] || 1, breaks };
}

function skillsOf(snapshot) {
  return (snapshot.skill_groups || []).flatMap((group) => group.skills || []);
}

// Medal counts need medals: snapshots before them (a bare "earned" flag) have no answer here.
function medalCount(snapshot, tier) {
  const items = snapshot.achievements;
  if (!items || items.some((item) => !('tier' in item))) return null;
  return items.filter((item) => item.tier === tier).length;
}

// Sections of the progression: every row takes a snapshot and gives a number or null when the snapshot does
// not know it (older archive formats). "better" colors the trend: which way is an improvement.
function progressSections() {
  const hero = (s) => (s.insights && s.insights.hero) || {};
  const stats = (s) => hero(s).stats || {};
  const skills = (s) => (s.skill_groups ? skillsOf(s) : null);
  const medal = (tier) => MEDALS[tier].name.toLowerCase();
  return [
    ['hero', IT.sectionHero, [
      { label: IT.level, better: 'up', value: (s) => s.level && s.level.level },
      { label: IT.xpTotal, better: 'up', value: (s) => hero(s).xp },
    ]],
    ['attributes', IT.sectionAttributes, byValue(C.attributes || []).map((attr) => ({
      label: `${attr.abbr} ${attr.name.toLowerCase()}`, better: 'up',
      value: (s) => ((s.attributes || []).find((item) => item.key === attr.key) || {}).value,
    }))],
    ['items', IT.sectionItems, [
      { label: IT.skillsCount, value: (s) => skills(s) && skills(s).length },
      { label: IT.skilled, better: 'up', value: (s) => skills(s) && skills(s).filter((k) => k.rank >= SKILLED_RANK).length },
      { label: IT.rustyCount, better: 'down', value: (s) => skills(s) && skills(s).filter((k) => k.rusty).length },
      { label: IT.itemsCount, value: (s) => s.gear && s.gear.length },
      { label: IT.epicCount, better: 'up', value: (s) => s.gear && s.gear.filter((i) => ['epic', 'legendary'].includes(i.rarity)).length },
      { label: IT.aurasCount, value: (s) => s.auras && s.auras.filter((a) => a.tier >= 0).length },
    ]],
    ['medals', IT.sectionMedals, [
      { label: medal(2), better: 'up', value: (s) => medalCount(s, 2) },
      { label: medal(1), value: (s) => medalCount(s, 1) },
      { label: medal(0), value: (s) => medalCount(s, 0) },
    ]],
    // Each snapshot's last 30 days: totals over the whole path only ever grow and say nothing on a chart.
    ['work', IT.sectionWork(30), [
      { label: IT.humanSessions, value: (s) => stats(s).recent && stats(s).recent.sessions },
      { label: IT.turns, value: (s) => stats(s).recent && stats(s).recent.human_turns },
      { label: IT.heroHours, digits: 1, value: (s) => stats(s).recent && stats(s).recent.hours },
      { label: IT.goldMillions, digits: 1,
        value: (s) => s.insights && s.insights.treasury && s.insights.treasury.gold && s.insights.treasury.gold.units / 1e6 },
    ]],
  ];
}

// Named states of the hero with the day they hold since; they go under the hero's charts.
const PROGRESS_STATES = [
  [IT.stateClass, (s) => s.class && s.class.name],
  [IT.stateTitle, (s) => s.title && T.quote(s.title)],
  [IT.stateAlignment, (s) => s.alignment && s.alignment.name],
  [IT.stateGold, (s) => s.treasury && s.treasury.gold && s.treasury.gold.name],
  [IT.stateCamp, (s) => s.treasury && s.treasury.camp && s.treasury.camp.name],
];

function progressStates(points) {
  const rows = [];
  for (const [label, get] of PROGRESS_STATES) {
    const values = points.map(get);
    const current = values[values.length - 1];
    if (current == null) continue;
    let since = values.length - 1;
    while (since > 0 && values[since - 1] === current) since -= 1;
    const row = el('div', 'pstate');
    row.appendChild(el('span', 'k', label));
    const value = el('span', 'v', current);
    const note = since === 0 ? null
      : `${IT.since(fmtShortDay(points[since].generated_at))}${values[since - 1] != null ? IT.before(values[since - 1]) : ''}`;
    if (note) value.appendChild(el('span', 'n', note));
    row.appendChild(value);
    rows.push(row);
  }
  return rows;
}

// A tiny trend line: known values joined left to right by time, the last one marked; flat when nothing changed.
// A stretch across a squeezed break is dashed and the break itself is a dotted tick.
function sparkline(values, line) {
  const width = 96;
  const height = 24;
  const pad = 3;
  const root = svg('svg', { viewBox: `0 0 ${width} ${height}`, class: 'spark', 'aria-hidden': 'true' });
  const known = values.map((value, i) => [i, value]).filter(([, value]) => value != null);
  if (known.length < 2) return root;
  const low = Math.min(...known.map(([, value]) => value));
  const high = Math.max(...known.map(([, value]) => value));
  const x = (i) => pad + ((width - 2 * pad) * line.xs[i]) / line.total;
  const y = (value) => (high === low ? height / 2 : height - pad - ((height - 2 * pad) * (value - low)) / (high - low));
  const at = ([i, value]) => `${x(i).toFixed(1)},${y(value).toFixed(1)}`;
  const path = known.map((point, k) => `${k ? 'L' : 'M'}${at(point)}`).join(' ');
  const first = x(known[0][0]).toFixed(1);
  const last = x(known[known.length - 1][0]).toFixed(1);
  root.appendChild(svg('path', { d: `${path} L${last},${height} L${first},${height} Z`, class: 'area' }));
  for (const brk of line.breaks) {
    const middle = ((x(brk.index - 1) + x(brk.index)) / 2).toFixed(1);
    root.appendChild(svg('line', { x1: middle, x2: middle, y1: 1, y2: height - 1, class: 'brk' }));
  }
  for (let k = 1; k < known.length; k++) {
    const squeezed = line.breaks.some((brk) => brk.index > known[k - 1][0] && brk.index <= known[k][0]);
    root.appendChild(svg('path', { d: `M${at(known[k - 1])} L${at(known[k])}`, class: squeezed ? 'line gap' : 'line' }));
  }
  const [lastIndex, lastValue] = known[known.length - 1];
  root.appendChild(svg('rect', { x: x(lastIndex) - 2, y: y(lastValue) - 2, width: 4, height: 4, class: 'dot' }));
  return root;
}

function progressTile(row, points, line) {
  const values = points.map(row.value);
  const current = values[values.length - 1];
  const firstIndex = values.findIndex((value) => value != null);
  const tile = el('div', 'ptile');
  const text = el('div');
  text.appendChild(el('span', 'pl', row.label));
  text.appendChild(el('span', 'pv', current == null ? '—' : num(current, row.digits || 0)));
  const known = values.filter((value) => value != null).length;
  if (current == null || known < 2) {
    text.appendChild(el('span', 'pt quiet', IT.building));
  } else {
    const diff = Number((current - values[firstIndex]).toFixed(row.digits || 0));
    const since = IT.since(fmtShortDay(points[firstIndex].generated_at));
    const trend = el('span', 'pt', diff ? `${diff > 0 ? '+' : '−'}${num(Math.abs(diff), row.digits || 0)} ${since}` : IT.noChange(since));
    if (diff && row.better) trend.classList.add((diff > 0) === (row.better === 'up') ? 'good' : 'bad');
    text.appendChild(trend);
  }
  tile.appendChild(text);
  tile.appendChild(sparkline(values, line));
  return tile;
}

// Items of a snapshot keyed for comparison: by real name when both snapshots know it (an alias can be renamed),
// by the page alias otherwise.
function itemsOf(snapshot, kind, byRealName) {
  const list = kind === 'skills' ? skillsOf(snapshot) : snapshot.gear || [];
  const real = byRealName && snapshot.insights && snapshot.insights[kind];
  return new Map(list.map((item) => [(real && real[item.alias] && real[item.alias].name) || item.alias, item]));
}

function withRealName(snapshot, kind, item) {
  const real = snapshot.insights && snapshot.insights[kind] && snapshot.insights[kind][item.alias];
  return real ? `${T.quote(item.alias)} (${real.name})` : T.quote(item.alias);
}

function changesBetween(before, after) {
  const lines = [];
  const moved = (label, get) => {
    const a = get(before);
    const b = get(after);
    if (a != null && b != null && a !== b) lines.push(`${label}: ${a} → ${b}`);
  };
  moved(IT.level, (s) => s.level && s.level.level);
  moved(IT.stateClass, (s) => s.class && s.class.name);
  moved(IT.stateTitle, (s) => s.title);
  moved(IT.stateAlignment, (s) => s.alignment && s.alignment.name);
  moved(IT.stateGold, (s) => s.treasury && s.treasury.gold && s.treasury.gold.name);
  moved(IT.stateCamp, (s) => s.treasury && s.treasury.camp && s.treasury.camp.name);
  const attrs = (after.attributes || []).map((attr) => {
    const old = (before.attributes || []).find((item) => item.key === attr.key);
    return old && old.value !== attr.value ? `${attr.abbr} ${old.value} → ${attr.value}` : null;
  }).filter(Boolean);
  if (attrs.length) lines.push(`${IT.attributesChange}: ${attrs.join(', ')}`);
  for (const item of after.achievements || []) {
    const old = (before.achievements || []).find((entry) => entry.key === item.key);
    if (!old || !('tier' in item) || !('tier' in old) || item.tier <= old.tier) continue;
    lines.push(IT.medalChange(item.name, old.tier >= 0 ? MEDALS[old.tier].name.toLowerCase() : null,
      MEDALS[item.tier].name.toLowerCase()));
  }
  const byRealName = Boolean(before.insights && after.insights);
  // Ranks and rarities are compared by their index and key: their names are words of the page language.
  const changes = [['skills', 'rank', 'rank_name', IT.newSkills], ['gear', 'rarity', 'rarity_name', IT.newItems]];
  for (const [kind, level, field, fresh] of changes) {
    const old = itemsOf(before, kind, byRealName);
    // A renamed real name (a server split into categories) keeps its alias: it is the same item, not a new one.
    const oldByAlias = itemsOf(before, kind, false);
    const added = [];
    for (const [key, item] of itemsOf(after, kind, byRealName)) {
      const was = old.get(key) || oldByAlias.get(item.alias);
      if (!was) added.push(`${withRealName(after, kind, item)} — ${item[field]}`);
      else if (was[level] !== item[level]) lines.push(`${withRealName(after, kind, item)}: ${was[field]} → ${item[field]}`);
    }
    if (added.length) lines.push(`${fresh}: ${added.join(', ')}`);
  }
  for (const aura of after.auras || []) {
    const old = (before.auras || []).find((entry) => entry.key === aura.key);
    if (!old) lines.push(IT.newAura(aura.name, aura.tier_name));
    else if (old.tier !== aura.tier) lines.push(`${T.quote(aura.name)}: ${old.tier_name} → ${aura.tier_name}`);
  }
  return lines;
}

function renderProgression(app) {
  const panel = el('section', 'panel progress-panel');
  panel.appendChild(el('h2', null, IT.progression));
  const points = historyPoints();
  if (points.length < 2) {
    panel.appendChild(insLine(IT.historyStarts));
    app.appendChild(panel);
    return;
  }
  const line = timeline(points);
  const breaks = [...line.breaks].sort((a, b) => b.days - a.days).slice(0, 3)
    .sort((a, b) => a.index - b.index)
    .map((brk) => IT.breakRange(fmtShortDay(brk.from.generated_at), fmtShortDay(brk.to.generated_at), brk.days));
  panel.appendChild(insLine(IT.points(points.length, fmtDay(points[0].generated_at))
    + (breaks.length ? IT.breaks(GAP_CAP_DAYS, breaks.join(', '), line.breaks.length > breaks.length) : ''), 'dim'));
  const grid = el('div', 'pgrid');
  for (const [key, title, rows] of progressSections()) {
    // A row no shown snapshot knows (numbers of work before the insights mode) is left out, and so is an empty card.
    const tiles = rows.filter((row) => points.some((point) => row.value(point) != null))
      .map((row) => progressTile(row, points, line));
    const extra = key === 'hero' ? progressStates(points) : [];
    if (!tiles.length && !extra.length) continue;
    const card = el('div', 'pcard');
    card.appendChild(el('h4', null, title));
    tiles.forEach((tile) => card.appendChild(tile));
    extra.forEach((row) => card.appendChild(row));
    grid.appendChild(card);
  }
  // Only the steps where something changed, newest first: a quiet day says nothing.
  const steps = [];
  for (let i = points.length - 1; i > 0 && steps.length < 6; i--) {
    const lines = changesBetween(points[i - 1], points[i]);
    if (lines.length) steps.push([points[i], lines]);
  }
  const log = el('div', 'pcard');
  log.appendChild(el('h4', null, IT.changes));
  if (!steps.length) log.appendChild(el('span', 'quiet small', IT.noChanges));
  for (const [point, lines] of steps) {
    const step = el('div', 'pstep');
    step.appendChild(el('b', null, fmtDay(point.generated_at)));
    lines.forEach((line) => step.appendChild(el('span', null, line)));
    log.appendChild(step);
  }
  grid.appendChild(log);
  panel.appendChild(grid);
  app.appendChild(panel);
}

function insHero() {
  const hero = I.hero;
  const stats = hero.stats || {};
  const xp = I.rules.xp;
  const parts = hero.xp_parts;
  const groups = el('div', 'insgroups');

  // Every number says what it is made of: "243 сессии по 10 опыта", not a bare multiplier.
  groups.appendChild(insGroup(IT.xpGroup, [
    [IT.total, IT.xpAmount(num(hero.xp))],
    parts && [IT.forSessions, IT.times(count(stats.sessions, IT.sessionForms), xp.session, num(parts.sessions))],
    parts && [IT.forTurns, IT.times(count(hero.counted_turns, IT.turnForms), xp.turn, num(parts.turns)), IT.turnCap(xp.turn_cap)],
    parts && [IT.forDays, IT.times(count(stats.active_days, IT.dayForms), xp.day, num(parts.days))],
    [IT.toLevel(C.level.level + 1), IT.xpLeft(num(C.level.need - C.level.into)), IT.growth(num(100 * (xp.growth - 1)))],
  ]));

  const ratio = hero.class_ratio;
  const hybridFrom = pct(I.rules.hybrid_ratio);
  let kind = null;
  if (C.class.secondary) kind = [IT.classKind, IT.hybrid, IT.hybridShare(pct(ratio), hybridFrom)];
  else if (ratio != null) kind = [IT.classKind, IT.pure, IT.pureShare(pct(ratio), hybridFrom)];
  else if (C.class.primary) kind = [IT.classKind, IT.pure, IT.oneSchool];
  const titled = titleSource();
  const source = titled && I.achievements[titled.key];
  groups.appendChild(insGroup(IT.classTitle, [
    kind,
    C.class.basis === 'peak' ? [IT.schoolScore, IT.byPeak, IT.rusted] : null,
    source && source.tier >= 0
      ? [IT.title, IT.titleMedal(C.title, MEDALS[source.tier].name.toLowerCase()),
        `${source.metric}: ${num(source.value, 1)}${source.unit ? ` ${source.unit}` : ''}`]
      : null,
  ]));

  groups.appendChild(insGroup(IT.path, [
    C.period ? [IT.period, `${fmtDay(C.period.from)} — ${fmtDay(C.period.to)}`] : null,
    [IT.humanSessions, num(stats.sessions),
      stats.all_sessions > stats.sessions ? IT.background(num(stats.all_sessions - stats.sessions)) : null],
    [IT.turns, num(stats.human_turns)],
    [IT.toolCalls, num(stats.tool_calls)],
    [IT.activeDays, num(stats.active_days)],
    stats.hero_hours != null && stats.active_days
      ? [IT.heroTime, IT.hours(num(stats.hero_hours, 1)), IT.perDay(num(stats.hero_hours / stats.active_days, 1))]
      : null,
    [IT.projects, num(stats.locations)],
    stats.top_places && stats.top_places.length
      ? [IT.mostOften, stats.top_places.map((place) => `${place.name} — ${count(place.sessions, IT.sessionForms)}`).join('\n')]
      : null,
  ]));

  return groups;
}

function insSchool(key) {
  const school = I.schools && I.schools[key];
  if (!school) return null;
  // The school's strength is the sum of its skills' scores (peaks when the class is counted by peaks): the share of
  // each skill shows whether the school stands on many skills or on one.
  const byPeak = C.class.basis === 'peak';
  const skills = Object.values(I.skills || {}).filter((skill) => skill.school === key)
    .map((skill) => [skill.name, byPeak ? skill.peak : skill.score]).sort((a, b) => b[1] - a[1]);
  const total = skills.reduce((sum, [, score]) => sum + score, 0);
  const leaders = skills.slice(0, 3).map(([name, score]) => `${name} ${total ? pct(score / total) : '—'}`).join(' · ');
  const more = skills.length > 3 ? IT.more(skills.length - 3) : '';
  return insLine(`${count(skills.length, IT.skillForms)}: ${leaders}${more}`);
}

function insAttributesNote() {
  return insLine(IT.attributesNote(I.rules.window_days), 'dim');
}

function insAttribute(key) {
  const attr = I.attributes && I.attributes[key];
  if (!attr) return null;
  // The same "label — value" table as the hero's; a metric's score is said in words, not with an arrow.
  const groups = el('div', 'insgroups');
  const group = insGroup(IT.howCounted, attr.metrics.map((metric) => [
    metric.label, metric.value, metric.score == null ? null : IT.score(num(metric.score, 1)),
  ]));
  group.insertBefore(insLine(`${attr.rule[0].toUpperCase()}${attr.rule.slice(1)}.`, 'dim'), group.children[1]);
  groups.appendChild(group);
  return groups;
}

function insSkillsRule() {
  const rules = I.rules;
  return insBox([
    IT.skillRule(rules.daily_cap, rules.half_life),
    insLine(IT.ranksBy(rules.ranks.map(([at, name]) => `${name} ${num(at)}`).join(' · ')), 'dim'),
  ]);
}

function insSkill(alias) {
  const skill = I.skills && I.skills[alias];
  if (!skill) return null;
  const next = skill.next ? IT.toNext(skill.next.name, num(skill.next.at)) : IT.topRank;
  return insBox([
    realName(skill.name),
    `${IT.scoreTo(num(skill.score, 2), skill.rank)}${next}`,
    skill.peak_rank !== skill.rank ? IT.wasRank(skill.peak_rank, num(skill.peak, 2), fmtDay(skill.peak_day)) : null,
    `${count(skill.sessions, IT.sessionForms)}, ${count(skill.calls, IT.callForms)} · ${IT.lastTime(ago(skill.last_day))}`,
  ]);
}

// One insights row, the way auras and attributes look: icon on the left, name and tag on top, a note, the details.
function insRow(canvas, name, tag, note, details) {
  const row = el('div', 'irow');
  row.appendChild(canvas);
  row.appendChild(el('span', 'nm', name));
  row.appendChild(el('span', 'tr', tag || ''));
  if (note) row.appendChild(el('span', 'fx small muted', note));
  put(row, details);
  return row;
}

function iconCanvas() {
  const canvas = el('canvas');
  canvas.width = 8; canvas.height = 8;
  return canvas;
}

function gearDetails(alias) {
  const gear = I.gear && I.gear[alias];
  if (!gear) return null;
  const next = gear.next ? IT.toNext(gear.next.name, num(gear.next.at)) : IT.topRarity;
  // A server with a hundred tools would bury the rest: the most called ones are listed, the tail is summed up.
  const listed = gear.tools.slice(0, TOOLS_LISTED).map(([tool, calls]) => `${tool} ×${num(calls)}`).join(', ');
  const rest = gear.tools.slice(TOOLS_LISTED);
  const tail = rest.length ? IT.moreTools(count(rest.length, IT.toolForms),
    count(rest.reduce((sum, [, calls]) => sum + calls, 0), IT.callForms)) : '';
  return insBox([
    realName(gear.name),
    `${IT.scoreTo(num(gear.score, 2), gear.rarity)}${next}`,
    gear.peak_rarity !== gear.rarity ? IT.wasRarity(gear.peak_rarity, num(gear.peak, 2), fmtDay(gear.peak_day)) : null,
    `${count(gear.sessions, IT.sessionForms)}, ${count(gear.calls, IT.callForms)} · ${IT.lastTime(ago(gear.last_day))}`,
    insLine(IT.tools(`${listed}${tail}`), 'dim'),
  ]);
}

function gearRow(item, canvas, note) {
  const tag = item.peak_rarity !== item.rarity ? IT.peakTag(item.rarity_name, item.peak_rarity_name) : item.rarity_name;
  const row = insRow(canvas, item.alias, tag, note, gearDetails(item.alias));
  row.classList.add(item.rarity);
  row.style.setProperty('--r', `var(--${item.rarity})`);
  return row;
}

function insGearRows(panel) {
  const rules = I.rules;
  panel.appendChild(insBox([
    IT.itemRule(rules.daily_cap, rules.half_life),
    insLine(IT.raritiesBy(rules.rarities.map(([at, name]) => `${name} ${num(at)}`).join(' · ')), 'dim'),
  ]));
  const slots = Object.fromEntries(C.slots.map((slot) => [slot.key, slot.name]));
  const affixes = (item) => `+${item.affixes} ${plural(item.affixes, T.affixes)}`;
  const worn = {};
  for (const item of C.gear) if (item.equipped && item.slot) worn[item.slot] = item;
  const doll = el('div', 'irows');
  for (const slot of slotsByRarity(worn)) {
    const item = worn[slot.key];
    const canvas = iconCanvas();
    drawSlotIcon(canvas, slot.key, item);
    if (item) {
      doll.appendChild(gearRow(item, canvas, IT.wornNote(slot.name, affixes(item))));
    } else {
      const row = insRow(canvas, IT.emptyRow(slot.name), '', IT.fits(slot.desc), null);
      row.classList.add('empty');
      doll.appendChild(row);
    }
  }
  panel.appendChild(doll);
  const bag = byRarity(C.gear.filter((item) => !item.equipped));
  panel.appendChild(el('h3', 'bag-title', T.bag));
  if (!bag.length) panel.appendChild(el('p', 'small muted', T.bagEmpty));
  const list = el('div', 'irows');
  for (const item of bag) {
    const gear = I.gear[item.alias] || {};
    const canvas = iconCanvas();
    drawIcon(canvas, item.alias, RARITY_HEX[item.rarity]);
    let place = IT.noSlot;
    if (gear.worn_instead) place = IT.wornInstead(slots[gear.slot] || gear.slot, gear.worn_instead);
    list.appendChild(gearRow(item, canvas, IT.inBag(place, affixes(item))));
  }
  panel.appendChild(list);
}

function insAura(aura) {
  const info = I.auras && I.auras[aura.key];
  if (!info) return null;
  const events = Object.entries(info.events || {});
  const hooks = Object.entries(info.hooks || {});
  const days = I.rules.window_days;
  let strength = IT.auraIdle(days, ago(info.last_day));
  if (info.tier_at != null) {
    const next = info.next_tier ? IT.toNext(info.next_tier.name, pct(info.next_tier.at)) : '';
    strength = IT.auraFired(info.sessions, info.window, pct(info.share), aura.tier_name, pct(info.tier_at), next);
  }
  return insBox([
    realName(events.map(([event]) => event).join(', ')),
    IT.hooks(hooks.length ? hooks.map(([name, fired]) => `${name} ×${num(fired)}`).join(', ') : IT.noScripts)
    + IT.fires(num(events.reduce((sum, [, fired]) => sum + fired, 0))),
    strength,
  ]);
}

// Where the hero stands on one axis: three zones with the hero's mark, the value clamped to the drawn range.
function alignmentScale(value, low, high, lower, upper, labels, colors) {
  const box = el('div');
  const scale = el('div', 'ascale');
  const share = (from, to) => `${(100 * (to - from)) / (high - low)}%`;
  [[low, lower], [lower, upper], [upper, high]].forEach(([from, to], i) => {
    const zone = el('span');
    zone.style.width = share(from, to);
    zone.style.background = colors[i];
    scale.appendChild(zone);
  });
  const mark = el('i');
  mark.style.left = share(low, Math.min(high, Math.max(low, value)));
  scale.appendChild(mark);
  box.appendChild(scale);
  const names = el('div', 'ascale-labels');
  labels.forEach((label) => names.appendChild(el('span', null, label)));
  box.appendChild(names);
  return box;
}

// How far the hero is from the next zone: the border it would cross first.
function alignmentMargin(value, lower, upper, names) {
  if (value >= upper) return IT.marginTo(num(value - upper, 2), names[1]);
  if (value < lower) return IT.marginTo(num(lower - value, 2), names[1]);
  return `${IT.marginTo(num(upper - value, 2), names[2])}, ${IT.marginTo(num(value - lower, 2), names[0])}`;
}

function insAlignment() {
  const a = I.alignment;
  if (!a || a.law_score == null) {
    return insBox([IT.noSessions(I.rules.window_days)]);
  }
  const sessions = a.sessions || 0;
  const of = (share) => IT.ofSessions(num(Math.round(share * sessions)), sessions);
  const groups = el('div', 'insgroups');

  // Order: three parts, each from 0 to 1; the weakest one is what holds the hero back.
  const lawNames = IT.lawNames;
  const lawZone = a.law_score >= a.lawful_from ? 2 : a.law_score <= a.chaotic_upto ? 0 : 1;
  const parts = a.law_parts || [];
  const weakest = parts.indexOf(Math.min(...parts));
  const part = (i) => IT.part(num(parts[i], 2), i === weakest);
  const [mode, modeSessions] = Object.entries(a.modes || {}).sort((x, y) => y[1] - x[1])[0] || ['—', 0];
  const law = insGroup(IT.lawTitle(num(a.law_score, 2), lawNames[lawZone]), [
    [IT.rules, count(a.rules_lines, IT.lineForms), IT.rulesNote(part(0))],
    [IT.planning, IT.planIn(of(a.plan_share)), part(1)],
    [IT.permissions, IT.mostMode(mode, IT.ofSessions(num(modeSessions), sessions)), part(2)],
    [IT.margin, alignmentMargin(a.law_score, a.chaotic_upto, a.lawful_from, lawNames)],
  ]);
  law.insertBefore(alignmentScale(a.law_score, 0, 1, a.chaotic_upto, a.lawful_from, IT.lawScale,
    ['rgba(255,159,67,.35)', 'rgba(143,180,196,.25)', 'rgba(91,141,239,.45)']), law.children[1]);
  groups.appendChild(law);

  // Character: sessions with checks or questions, minus sessions with destructive commands weighing triple.
  const moralNames = IT.moralNames;
  const moralZone = a.moral_score >= a.good_from ? 2 : a.moral_score < a.evil_below ? 0 : 1;
  const penalty = a.evil_weight * a.evil_share;
  const moral = insGroup(IT.moralTitle(num(a.moral_score, 2), moralNames[moralZone]), [
    [IT.checks, of(a.good_share), IT.checksNote(a.verifications, a.questions)],
    [IT.destructive, a.destructive ? IT.destructiveIn(a.destructive, Math.round(a.evil_share * sessions), sessions) : IT.none,
      a.destructive ? IT.penalty(a.evil_weight, num(penalty, 2)) : null],
    [IT.margin, alignmentMargin(a.moral_score, a.evil_below, a.good_from, moralNames)],
  ]);
  moral.insertBefore(alignmentScale(a.moral_score, -1, 1, a.evil_below, a.good_from, IT.moralScale,
    ['rgba(255,77,141,.4)', 'rgba(143,180,196,.25)', 'rgba(57,255,136,.35)']), moral.children[1]);
  groups.appendChild(moral);

  const box = el('div');
  box.appendChild(groups);
  const formula = insLine(IT.formula(a.evil_weight, I.rules.window_days), 'dim');
  formula.style.marginTop = '8px';
  box.appendChild(formula);
  return box;
}

// The gold weights in words, against input as the base: output is 5 times dearer, cache reads 10 times cheaper.
function priceNote(weights) {
  const others = TOKEN_LABELS.filter(([key]) => key !== 'input' && weights[key] !== weights.input).map(([key, label]) => {
    const ratio = weights[key] / weights.input;
    return ratio > 1 ? IT.dearer(label, IT.timesWord(ratio)) : IT.cheaper(label, IT.timesWord(1 / ratio));
  });
  return IT.price(others.join(', '));
}

// Token counts in words: 6,33 млрд, 104,8 млн, 59 тыс. or 6.33B, 104.8M, 59K.
function tokens(value) {
  return IT.tokens(value);
}

// The treasury in tokens first: how many, and how many of them are new against re-read from the cache (every call
// reads the whole context of its session again, so re-reads dwarf everything else); the gold weight comes last.
function insGold() {
  const gold = I.treasury && I.treasury.gold;
  if (!gold || !gold.tokens) return null;
  const weights = I.treasury.weights;
  const amount = (key) => gold.tokens[key] || 0;
  const total = TOKEN_LABELS.reduce((sum, [key]) => sum + amount(key), 0);
  const cached = amount('cache_read');
  const fresh = total - cached;
  const share = (value) => {
    const percent = total ? (100 * value) / total : 0;
    return percent && percent < 0.1 ? IT.lessThan : `${num(percent, percent < 10 ? 1 : 0)}%`;
  };
  const freshKinds = TOKEN_LABELS.filter(([key]) => key !== 'cache_read').sort((a, b) => amount(b[0]) - amount(a[0]));
  const dearest = (gold.dearest || []).map((session) => {
    const split = session.cache_read != null
      ? IT.split(tokens(session.tokens - session.cache_read), tokens(session.cache_read))
      : IT.tokensWord(tokens(session.tokens));
    return IT.dearestLine(fmtShortDay(session.day), session.place || '—', split, millions(session.units));
  });
  const rows = [
    [IT.total, IT.tokensWord(tokens(total))],
    [IT.fresh, `${tokens(fresh)} · ${share(fresh)}`, IT.freshNote],
    ...freshKinds.map(([key, label]) => [`· ${label}`, tokens(amount(key))]),
    [IT.reread, `${tokens(cached)} · ${share(cached)}`, IT.rereadNote],
    gold.sessions ? [IT.sessions, num(gold.sessions), IT.perSession(tokens(fresh / gold.sessions), tokens(cached / gold.sessions))] : null,
    dearest.length ? [IT.dearest, dearest.join('\n')] : null,
    [IT.goldWeight, millions(gold.units), priceNote(weights)],
    gold.next ? [IT.toTier(gold.next.name), millions(gold.next.at)] : null,
  ];
  const groups = el('div', 'insgroups');
  groups.appendChild(insGroup(IT.tokensTitle, rows));
  return groups;
}

function insCamp() {
  const camp = I.treasury && I.treasury.camp;
  if (!camp || camp.sessions == null) return null;
  const groups = el('div', 'insgroups');
  groups.appendChild(insGroup(IT.compactions, [
    [IT.total, num(camp.count)],
    [IT.withThem, num(camp.sessions)],
    [IT.mostPerSession, num(camp.max)],
    camp.next ? [IT.toTier(camp.next.name), num(camp.next.at)] : null,
  ]));
  return groups;
}

function achievementDetails(key) {
  const item = I.achievements && I.achievements[key];
  if (!item) return null;
  const tier = item.tier;
  const now = item.value_tier ?? tier;
  const unit = item.unit ? ` ${item.unit}` : '';
  const steps = (item.thresholds || []).map((at, i) => IT.medalFrom(MEDALS[i].name, num(at))).join(' · ');
  const next = now < 2 && item.thresholds
    ? IT.medalMissing(MEDALS[now + 1].name, `${num(item.thresholds[now + 1] - item.value, 1)}${unit}`) : '';
  let kept = null;
  if (tier > now) kept = IT.medalKept(MEDALS[tier].name, fmtDay(item.earned_at), now >= 0 ? MEDALS[now].name : null);
  return insBox([
    realName(`${item.metric}: ${num(item.value, 1)}${unit}`),
    item.record_day ? IT.record(fmtDay(item.record_day)) : null,
    `${steps}${next}`,
    kept ? insLine(kept, 'dim') : null,
  ]);
}

function insAchievementRows(ordered) {
  const list = el('div', 'irows');
  for (const item of ordered) {
    const tier = medalOf(item);
    const canvas = iconCanvas();
    drawAchievementIcon(canvas, item);
    // The note is the hero's own condition: of the medal reached, or of bronze while none is.
    let note = T.condition(item.criteria);
    if (Array.isArray(item.criteria)) note = `${MEDALS[Math.max(tier, 0)].name}: ${item.criteria[Math.max(tier, 0)]}.`;
    const row = insRow(canvas, item.name, tier >= 0 ? MEDALS[tier].name : IT.notEarned, note, achievementDetails(item.key));
    if (tier >= 0) row.style.setProperty('--r', MEDALS[tier].main);
    else row.classList.add('locked');
    list.appendChild(row);
  }
  return list;
}
// ==== Insights layer: end ====

// The static part of the page in its language: the document, the archive bar and its buttons.
function labelPage() {
  document.documentElement.lang = LANG;
  document.title = T.pageTitle;
  document.getElementById('nav').setAttribute('aria-label', T.navArchive);
  document.getElementById('prev').setAttribute('aria-label', T.navPrev);
  document.getElementById('next').setAttribute('aria-label', T.navNext);
  const insights = document.getElementById('ins');
  insights.textContent = T.insightsButton;
  insights.title = T.insightsHint;
  const shot = document.getElementById('shot');
  shot.textContent = T.shotButton;
  shot.title = T.shotHint;
}

function main() {
  const app = document.getElementById('app');
  labelPage();
  if (!Array.isArray(H) || !H.length) {
    document.getElementById('nav').hidden = true;
    const panel = el('section', 'panel empty');
    panel.appendChild(el('h2', null, T.noData));
    panel.appendChild(el('p', 'muted', T.noDataHint));
    app.appendChild(panel);
    return;
  }
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  let index = H.length - 1;
  const show = (target) => {
    index = Math.max(0, Math.min(H.length - 1, target));
    C = H[index];
    renderSnapshot(app);
    const current = index === H.length - 1;
    document.getElementById('where').textContent = current ? T.currentHero : T.archiveAt(index + 1, H.length);
    document.getElementById('when').textContent = T.snapshotOf(new Date(C.generated_at).toLocaleString(T.locale));
    prev.disabled = index === 0;
    next.disabled = current;
  };
  prev.addEventListener('click', () => show(index - 1));
  next.addEventListener('click', () => show(index + 1));
  const shot = document.getElementById('shot');
  shot.addEventListener('click', () => saveShot(shot));
  // The screenshot takes whatever is shown: with the insights mode on, it carries names and numbers too.
  const insights = document.getElementById('ins');
  const setInsights = (on) => {
    INSIGHTS = on;
    insights.setAttribute('aria-pressed', String(INSIGHTS));
  };
  insights.addEventListener('click', () => {
    setInsights(!INSIGHTS);
    show(index);
  });
  // A link that ends in #insights opens the page in the insights mode.
  setInsights(location.hash === '#insights');
  document.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft') show(index - 1);
    if (event.key === 'ArrowRight') show(index + 1);
  });
  // Horizontal swipe flips snapshots; mostly vertical gestures stay page scrolling.
  let touch = null;
  document.addEventListener('touchstart', (event) => {
    touch = { x: event.touches[0].clientX, y: event.touches[0].clientY };
  }, { passive: true });
  document.addEventListener('touchend', (event) => {
    if (!touch) return;
    const dx = event.changedTouches[0].clientX - touch.x;
    const dy = event.changedTouches[0].clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) show(index + (dx > 0 ? -1 : 1));
  });
  // Crossing the two-column width re-lays the blocks out.
  TWO_COLUMNS.addEventListener('change', () => show(index));
  show(index);
}

main();
</script>
